<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DucasOrderFlow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1220'/%3E%3Crect x='7' y='12' width='4' height='12' fill='%23ef4444'/%3E%3Crect x='14' y='6' width='4' height='18' fill='%23a855f7'/%3E%3Crect x='21' y='9' width='4' height='10' fill='%2322c55e'/%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#0b1220;color:#cbd5e1;font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#0b1220}
  #card{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{max-width:440px;width:100%;background:#111a2e;border:1px solid #1f2b45;border-radius:14px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  h1{font-size:19px;margin:0 0 4px;color:#fff} .muted{color:#7c8aa5;font-size:13px}
  .st{margin:16px 0;display:flex;gap:10px;align-items:center}
  .dot{width:11px;height:11px;border-radius:50%;background:#64748b;flex:none} .ok{background:#22c55e} .bad{background:#ef4444} .wait{background:#eab308;animation:p 1s infinite}
  @keyframes p{50%{opacity:.3}}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  button,a.b{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:9px;padding:9px 14px;font-size:14px;cursor:pointer;text-decoration:none}
  .pri{background:#2563eb;border-color:#2563eb}
  #fab{position:fixed;left:6px;bottom:6px;z-index:9;width:26px;height:26px;border-radius:50%;border:1px solid #334155;background:rgba(15,23,42,.55);color:#94a3b8;font-size:14px;padding:0;display:none}
  #menu{position:fixed;left:6px;bottom:38px;z-index:10;background:#111a2e;border:1px solid #334155;border-radius:10px;padding:6px;display:none;flex-direction:column;gap:4px;min-width:210px}
  #menu button,#menu a{text-align:left;font-size:13px;padding:8px 10px}
  label{font-size:13px;display:flex;gap:6px;align-items:center;margin-top:12px;color:#94a3b8}
</style>
</head>
<body>
<iframe id="app" allow="fullscreen; clipboard-read; clipboard-write; autoplay" referrerpolicy="no-referrer"></iframe>
<div id="card"><div class="box">
  <h1>📈 DucasOrderFlow</h1>
  <div class="muted">Fixed link · the app runs on your Colab / Cloud Shell / VPS</div>
  <div class="st"><span class="dot wait" id="dot"></span><span id="msg">Looking for your server…</span></div>
  <div class="muted" id="info"></div>
  <div class="btns">
    <button class="pri" id="retry">↻ Retry</button>
    <a class="b" id="direct" href="#" target="_top" style="display:none">Open directly ↗</a>
  </div>
  <label><input type="checkbox" id="redir"> Always open directly (no frame) — use this if login does not stay signed in</label>
</div></div>
<button id="fab" title="Menu">⋮</button>
<div id="menu">
  <a id="mDirect" href="#" target="_top">↗ Open the app directly</a>
  <button id="mReload">↻ Reload</button>
  <button id="mHide">✕ Hide this button</button>
</div>
<script>
(function () {
  'use strict';
  const REPO = 'smon14300/ducas', BRANCH = 'main', V = '4.19.1';
  const $ = id => document.getElementById(id), LS = localStorage;
  const app = $('app'), card = $('card');
  let cur = null, shown = false;
  $('redir').checked = LS.dofRedirect === '1';
  $('redir').onchange = () => { LS.dofRedirect = $('redir').checked ? '1' : '0'; if ($('redir').checked && cur) location.href = cur; };
  function status(kind, msg, info) { $('dot').className = 'dot ' + kind; $('msg').textContent = msg; $('info').innerHTML = info || ''; }
  const ago = ms => { const s = Math.round((Date.now() - ms) / 1000); return s < 90 ? s + ' s' : s < 5400 ? Math.round(s / 60) + ' min' : Math.round(s / 3600) + ' h'; };
  async function backend() {
    const q = new URLSearchParams(location.search).get('backend');
    if (q) return { url: q, started: Date.now(), host: 'manual' };
    try {        // GitHub API: always fresh (Pages files can be cached for ~10 min)
      const r = await fetch(`https://api.github.com/repos/${REPO}/contents/backend.json?ref=${BRANCH}&t=${Date.now()}`,
        { headers: { Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' });
      if (r.ok) return await r.json();
    } catch (e) { }
    const r = await fetch('backend.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('backend.json not found');
    return r.json();
  }
  async function alive(url) {
    const c = new AbortController(), t = setTimeout(() => c.abort(), 9000);
    try { await fetch(url.replace(/\/$/, '') + '/healthz?t=' + Date.now(), { mode: 'no-cors', cache: 'no-store', signal: c.signal }); return true; }
    catch (e) { return false; } finally { clearTimeout(t); }
  }
  function show(url) {
    cur = url; $('direct').href = url; $('mDirect').href = url; $('direct').style.display = '';
    if (LS.dofRedirect === '1') { location.href = url; return; }
    if (app.dataset.src !== url) { app.src = url; app.dataset.src = url; }
    app.style.display = 'block'; card.style.display = 'none'; shown = true;
    if (LS.dofFab !== '0') $('fab').style.display = 'block';
  }
  function hide() { app.style.display = 'none'; card.style.display = 'flex'; $('fab').style.display = 'none'; shown = false; }
  async function check(first) {
    let b;
    try { b = await backend(); }
    catch (e) { hide(); status('bad', 'No server address published yet.', 'Start the app (Main.py) on Colab / Cloud Shell once with your GitHub token in secret.txt.'); return; }
    if (!b || !b.url) { hide(); status('bad', 'No server address in backend.json.'); return; }
    if (shown && b.url === cur) return;                          // running fine
    status('wait', first ? 'Connecting to your server…' : 'Server restarted - connecting to the new address…',
      `server: ${b.host || '?'} · started ${b.started ? ago(b.started) + ' ago' : '?'}`);
    if (b.stopped) { hide(); status('bad', 'Your server was stopped.', `Last run: ${b.host || '?'}, ${ago(b.started)} ago. Start Main.py again.`); return; }
    if (await alive(b.url)) show(b.url);
    else { hide(); cur = b.url; $('direct').href = b.url; $('direct').style.display = '';
      status('bad', 'Server is offline.', `Last start: ${b.host || '?'}, ${b.started ? ago(b.started) + ' ago' : '?'}.<br>Start Main.py on Colab / Cloud Shell — this page connects by itself.`); }
  }
  $('retry').onclick = () => check(true);
  $('fab').onclick = () => { const m = $('menu'); m.style.display = m.style.display === 'flex' ? 'none' : 'flex'; };
  $('mReload').onclick = () => { $('menu').style.display = 'none'; app.src = cur; };
  $('mHide').onclick = () => { LS.dofFab = '0'; $('menu').style.display = 'none'; $('fab').style.display = 'none'; };
  // timers: GitHub allows 60 API calls / hour per visitor -> ask GitHub every 2 min while connected,
  // and only ping the server itself (free) every 30 s; offline -> look for a new address every 30 s
  let fails = 0, lastGh = 0;
  async function loop() {
    if (!document.hidden) {
      if (shown && cur) {
        if (await alive(cur)) fails = 0; else fails++;
        if (fails >= 2 || Date.now() - lastGh > 120000) { lastGh = Date.now(); if (fails >= 2) shown = false; await check(false); }
      } else { lastGh = Date.now(); await check(false); }
    }
    setTimeout(loop, 30000);
  }
  check(true).then(() => { lastGh = Date.now(); setTimeout(loop, 30000); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !shown) check(false); });
})();
</script>
<!-- launcher v4.19.1 · written by ducasOrderFlow Main.py -->
</body>
</html>
